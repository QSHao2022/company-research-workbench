name: AI organize meeting minutes

on:
  repository_dispatch:
    types: [organize_note]

permissions:
  contents: write

concurrency:
  group: organize-${{ github.event.client_payload.id }}
  cancel-in-progress: false

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private archive
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Organize minutes with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INPUT_PATH: ${{ github.event.client_payload.input_path }}
          OUTPUT_PATH: ${{ github.event.client_payload.output_path }}
          NOTE_ID: ${{ github.event.client_payload.id }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          async function main() {
            if (!process.env.OPENAI_API_KEY) throw new Error('Missing repository secret OPENAI_API_KEY');
            const inputPath = process.env.INPUT_PATH;
            const outputPath = process.env.OUTPUT_PATH;
            if (!inputPath.startsWith('.research-workbench/inbox/') || !outputPath.startsWith('.research-workbench/organized/')) {
              throw new Error('Invalid input/output path');
            }
            const source = JSON.parse(fs.readFileSync(inputPath, 'utf8'));
            const schema = {
              type: 'object',
              additionalProperties: false,
              properties: {
                company: {type:'string'},
                date: {type:'string'},
                title: {type:'string'},
                minutes: {type:'string'},
                above: {type:'string'},
                below: {type:'string'},
                followup: {type:'string'},
                judgment: {type:'string'}
              },
              required: ['company','date','title','minutes','above','below','followup','judgment']
            };
            const instructions = `你是一名严谨的中国化工、石化行业卖方研究助理。请将用户提供的原始业绩会、调研或电话会纪要整理成可供证券分析师复核的正式纪要。

必须遵守：
1. 只依据原始纪要，不联网，不补充外部事实，不擅自纠错。原文没有的数据不得编造；存在口径冲突、数字疑似错误或时间不清时，在正文标注“原文口径/待核实”，不要自行统一。
2. 保留核心经营数据、同比/环比、产能、产量、销量、价格、价差、库存、开工率、成本、资本开支、项目进度、管理层判断及关键客户/竞争格局。不要为了简短删除有投资价值的信息。
3. 合并重复内容，但保留不同时间段、不同口径和不同管理层表述的区别。不要把推测写成事实。
4. minutes 是正式纪要正文，按知识点设置小标题，建议结构为：业绩总览与财务、分业务经营情况、产能及项目进展、行业供需与竞争、成本与盈利、资本运作及其他。只保留与原文相关的章节，不要机械补齐。用连续段落表达，必要时列出关键数据。
5. above：超出预期或修正此前判断的地方。若原文没有明确预期基准，说明这是基于本次交流信息的初步判断，不要假定分析师原先预期。
6. below：低于预期或需要打折扣的地方。区分管理层明确表述与分析推断，指出兑现风险和口径限制。
7. followup：这次没问到、需要补问或进一步核实的问题，必须具体可执行，优先围绕影响盈利预测、产能兑现、价格成本、现金流和资本开支的变量。
8. judgment：我的判断有什么变化。用“原有判断/本次新增信息/当前判断/后续验证指标”组织；如果用户没有提供原有判断，不得假装知道，明确写“原有判断未在本次材料中提供”，并提出本次信息可能影响的判断。
9. 语气客观、专业、审慎；避免空话、宣传式表述和无依据的投资建议。中文输出。日期统一 YYYY-MM-DD；如果不能可靠识别则留空。
10. 用户输入可能包含错别字、语音转写错误和重复段落。可做不改变含义的文字润色；专有名词、数字、公司名称不确定时保留原样并标注待核实。`;
            const userInput = [
              '公司名称（用户填写）：' + (source.company || '未填写'),
              '会议日期（用户填写）：' + (source.date || '未填写'),
              '标题（用户填写）：' + (source.title || '未填写'),
              '',
              '以下为原始纪要全文，请严格按要求整理：',
              source.raw
            ].join('\\n');
            const response = await fetch('https://api.openai.com/v1/responses', {
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + process.env.OPENAI_API_KEY,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'gpt-6-luna',
                instructions,
                input: userInput,
                text: {
                  format: {
                    type: 'json_schema',
                    name: 'company_research_minutes',
                    strict: true,
                    schema
                  }
                },
                max_output_tokens: 12000
              })
            });
            const payload = await response.json();
            if (!response.ok) throw new Error('OpenAI API ' + response.status + ': ' + JSON.stringify(payload).slice(0, 1600));
            const outputText = (payload.output || []).flatMap(item => item.content || []).filter(item => item.type === 'output_text').map(item => item.text).join('\\n');
            if (!outputText) throw new Error('OpenAI returned no structured text: ' + JSON.stringify(payload).slice(0, 1200));
            const organized = JSON.parse(outputText);
            organized.id = process.env.NOTE_ID;
            organized.sourceLength = source.raw.length;
            organized.organizedAt = new Date().toISOString();
            fs.mkdirSync(path.dirname(outputPath), {recursive:true});
            fs.writeFileSync(outputPath, JSON.stringify(organized, null, 2) + '\\n');
          }
          main().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit organized draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.client_payload.output_path }}"
          git commit -m "Add AI-organized research minutes"
          git push origin HEAD:main
